name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out noblink
        uses: actions/checkout@v4
        with:
          ref: noblink
          fetch-depth: 0

      - name: Rebase onto latest upstream release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/oribarilan/vimcode.git
          git fetch upstream --tags --force
          LATEST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          echo "Latest upstream release: $LATEST"
          if git merge-base --is-ancestor "$LATEST" HEAD; then
            echo "noblink already contains $LATEST"
            exit 0
          fi
          git rebase "$LATEST"

      - name: Push rebased branch
        run: git push --force-with-lease origin noblink
